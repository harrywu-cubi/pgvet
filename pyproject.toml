[project]
name = "pgvet"
version = "0.0.1"
description = "A pluggable, local-only PostgreSQL doctor."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlglot>=23",
    "textual>=0.60",
    "rich>=13",
]

[project.scripts]
pgvet = "pgvet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgvet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: opt-in tests that require a live Postgres"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
